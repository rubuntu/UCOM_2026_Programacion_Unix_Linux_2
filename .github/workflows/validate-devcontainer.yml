name: Validar Dev Container

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar Dev Container con devcontainer CLI
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          runCmd: |
            echo "Verificando herramientas bÃ¡sicas..."
            docker version
            which unshare
            which strace
            which lsof
            which fuser
            which ip
            echo "âœ… Dev Container validado exitosamente."
